<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formcatch — Test Form</title>
<style>
  body { font-family: sans-serif; max-width: 420px; margin: 60px auto; padding: 0 20px; }
  label { display: block; margin: 16px 0 4px; font-weight: 600; }
  input, textarea { width: 100%; padding: 8px; box-sizing: border-box; font-size: 14px; }
  button { margin-top: 20px; padding: 10px 20px; font-size: 14px; cursor: pointer; }
  p.note { color: #666; font-size: 13px; }
</style>
</head>
<body>
  <h1>Test contact form</h1>
  <p class="note">This is a throwaway page just to confirm the filter works end to end. Submitting sends a real row to your dashboard.</p>

  <script src="formcatch.js" data-site="32447906-e032-4294-8c9f-e2aa55ee091d"></script>

  <form data-formcatch method="POST" action="/api/submit">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="4" required></textarea>

    <button type="submit">Send test submission</button>
  </form>
</body>
</html>
